version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend
    restart: unless-stopped
    pid: "host"
    cap_add:
      - SYS_ADMIN
    ports:
      - "8001:8000"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:rw
      - /var/log:/host-logs:ro
      - devops-data:/var/lib/devops-manager
      - /:/host/root:ro,rslave
    environment:
      - PBS_API_URL=${PBS_API_URL:-}
      - PBS_API_TOKEN=${PBS_API_TOKEN:-}
      - PBS_DATASTORE=${PBS_DATASTORE:-}
      - TRAEFIK_ACME_PATH=${TRAEFIK_ACME_PATH:-/etc/traefik/acme.json}
      - BACKEND_DATA_DIR=${BACKEND_DATA_DIR:-/var/lib/devops-manager}
      - TERMINAL_TOKEN=${TERMINAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  devops-data:
